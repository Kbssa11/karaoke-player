<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Player</title>
<style>html, body, #alvo { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }</style>
</head>
<body>
<div id="alvo"></div>
<script>
// Esta página mora num site de verdade, então o YouTube sabe de onde vem o pedido.
// Ela conversa com o app da TV por mensagens: avisa o que acontece e aceita comandos.
var avisar = function (t) { parent.postMessage("karaoke:" + t, "*"); };
var player;
var ESTADOS = { "-1": "nao-comecou", 0: "acabou", 1: "tocando", 2: "pausado", 3: "carregando", 5: "pronto" };

window.onYouTubeIframeAPIReady = function () {
    var v = new URLSearchParams(location.search).get("v");
    player = new YT.Player("alvo", {
        videoId: v,
        playerVars: { autoplay: 1, controls: 0, playsinline: 1, rel: 0, origin: location.origin },
        events: {
            onReady: function () { avisar("pronto"); comecar(); },
            onStateChange: function (e) {
                var extra = "";
                if (e.data === -1) {
                    // "não começou" sem erro: o motivo fica nos dados do vídeo
                    var d = player.getVideoData() || {};
                    extra = " (tocavel=" + d.isPlayable + " motivo=" + d.errorCode + ")";
                }
                avisar("estado:" + (ESTADOS[e.data] || e.data) + extra);
            },
            onError: function (e) { avisar("erro:" + e.data); }
        }
    });
};

// Começar com som pode ser barrado (regra de autoplay). Se em 1,5 s não tocou,
// começa sem som e tenta devolver o som logo depois.
function comecar() {
    player.playVideo();
    setTimeout(function () {
        if (player.getPlayerState() === 1) return;
        avisar("autoplay barrado; tentando sem som");
        player.mute();
        player.playVideo();
        setTimeout(function () {
            player.unMute();
            setTimeout(function () {
                avisar("depois de religar o som: estado=" + player.getPlayerState() + " mudo=" + player.isMuted());
            }, 1500);
        }, 1500);
    }, 1500);
}

window.addEventListener("message", function (e) {
    if (!player || typeof e.data !== "string") return;
    var p = e.data.split(":");
    if (p[0] === "tocar") player.playVideo();
    else if (p[0] === "pausar") player.pauseVideo();
    else if (p[0] === "fim") player.seekTo(player.getDuration() - 3, true);
    else if (p[0] === "carregar") { player.loadVideoById(p[1]); setTimeout(comecar, 500); }
    else if (p[0] === "som") player.unMute();
});

var s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);
</script>
</body>
</html>
